[project]
name = "omics-radar"
version = "0.1.0"
description = "Local editor and static newsletter publisher for BBSR Omics Radar"
readme = "implementation.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3.0",
    "pytz>=2025.2",
    "streamlit>=1.46.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
